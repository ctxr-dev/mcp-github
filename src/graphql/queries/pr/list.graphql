query PRList(
  $owner: String!
  $name: String!
  $states: [PullRequestState!]
  $headRefName: String
  $baseRefName: String
  $first: Int!
  $after: String
) {
  repository(owner: $owner, name: $name) {
    pullRequests(
      first: $first
      after: $after
      states: $states
      headRefName: $headRefName
      baseRefName: $baseRefName
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        url
        id
        title
        state
        body
        baseRefName
        headRefName
        isDraft
        mergeable
        merged
        mergedAt
        mergeCommit {
          oid
        }
        reviewDecision
        labels(first: 100) {
          pageInfo {
            hasNextPage
          }
          nodes {
            name
          }
        }
        assignees(first: 100) {
          pageInfo {
            hasNextPage
          }
          nodes {
            login
          }
        }
        author {
          login
        }
        createdAt
        updatedAt
        closedAt
        reviews(first: 100) {
          pageInfo {
            hasNextPage
          }
          nodes {
            state
            author {
              login
            }
            submittedAt
          }
        }
        reviewThreads(first: 100) {
          pageInfo {
            hasNextPage
          }
          nodes {
            comments(first: 0) {
              totalCount
            }
          }
        }
        commits(last: 1) {
          nodes {
            commit {
              statusCheckRollup {
                state
                contexts(first: 100) {
                  pageInfo {
                    hasNextPage
                  }
                  nodes {
                    __typename
                    ... on CheckRun {
                      name
                      conclusion
                      status
                    }
                    ... on StatusContext {
                      context
                      state
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
