query RepoContext($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    id
    labels(first: 100) {
      pageInfo {
        hasNextPage
      }
      nodes {
        id
        name
      }
    }
    assignableUsers(first: 100) {
      pageInfo {
        hasNextPage
      }
      nodes {
        id
        login
      }
    }
  }
}
